<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1600" y2="1080"><stop stop-color="#0A0D14"/><stop offset="1" stop-color="#111628"/></linearGradient>
    <style>.card{fill:#111824;stroke:#2D3B4E;stroke-width:1.4}.k{font:600 13px Arial,sans-serif;letter-spacing:2px;fill:#8BE2DC}.t{font:600 25px Arial,sans-serif;fill:#F0F2F7}.d{font:16px Arial,sans-serif;fill:#9CA6B6}.w{font:700 33px Arial,sans-serif;letter-spacing:-1.7px;fill:#F2F4F8}</style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg2)"/>
  <text x="90" y="100" class="k">LEXIS / MINIMAL LOGO DIRECTIONS</text>
  <text x="90" y="155" class="t" style="font-size:44px;letter-spacing:-2.5px">Пять компактных знаков — без сложной графики.</text>
  <text x="90" y="198" class="d">Каждый рассчитан на размер примерно 20–28 px в шапке сайта.</text>

  <g transform="translate(90 270)"><rect class="card" width="440" height="330" rx="8"/>
    <text x="30" y="40" class="k">01 / THREE DOTS</text>
    <g transform="translate(174 100)"><circle cx="0" cy="45" r="13" fill="#8BE2DC"/><circle cx="43" cy="24" r="13" fill="#AFA8F7"/><circle cx="86" cy="45" r="13" fill="#8BE2DC"/></g>
    <text x="30" y="232" class="w">LEXIS<tspan fill="#8BE2DC">.</tspan></text><text x="30" y="268" class="d">Три стадии · одна система</text><text x="30" y="296" class="d">Самый мягкий и дружелюбный</text>
  </g>

  <g transform="translate(580 270)"><rect class="card" width="440" height="330" rx="8"/>
    <text x="30" y="40" class="k">02 / OPEN BRACKET</text>
    <g transform="translate(175 89)" fill="none" stroke="#8BE2DC" stroke-width="12" stroke-linecap="round"><path d="M62 8H24v112h38"/><path d="M78 8h38v112H78" stroke="#AFA8F7"/></g>
    <text x="30" y="232" class="w">LEXIS<tspan fill="#8BE2DC">.</tspan></text><text x="30" y="268" class="d">Текст внутри управляемой рамки</text><text x="30" y="296" class="d">Редакционный, строгий, узнаваемый</text>
  </g>

  <g transform="translate(1070 270)"><rect class="card" width="440" height="330" rx="8"/>
    <text x="30" y="40" class="k">03 / SINGLE PATH</text>
    <g transform="translate(156 100)" fill="none" stroke-linecap="round"><path d="M0 72C36 72 34 16 70 16h78" stroke="#8BE2DC" stroke-width="12"/><circle cx="160" cy="16" r="10" fill="#AFA8F7" stroke="none"/></g>
    <text x="30" y="232" class="w">LEXIS<tspan fill="#8BE2DC">.</tspan></text><text x="30" y="268" class="d">Один ясный путь материала</text><text x="30" y="296" class="d">Самый «конвейерный» знак</text>
  </g>

  <g transform="translate(335 670)"><rect class="card" width="440" height="330" rx="8"/>
    <text x="30" y="40" class="k">04 / LX DOT</text>
    <g transform="translate(162 88)" fill="none" stroke-linecap="round"><path d="M13 10v112h56" stroke="#8BE2DC" stroke-width="13"/><path d="M92 16l74 98M166 16l-74 98" stroke="#AFA8F7" stroke-width="12"/><circle cx="181" cy="16" r="8" fill="#8BE2DC" stroke="none"/></g>
    <text x="30" y="232" class="w">LEXIS<tspan fill="#8BE2DC">.</tspan></text><text x="30" y="268" class="d">Минимальная монограмма LX</text><text x="30" y="296" class="d">Лучше всего для favicon</text>
  </g>

  <g transform="translate(825 670)"><rect class="card" width="440" height="330" rx="8"/>
    <text x="30" y="40" class="k">05 / SIGNAL</text>
    <g transform="translate(169 93)"><path d="M0 105V62M35 105V35M70 105V8" stroke="#8BE2DC" stroke-width="12" stroke-linecap="round"/><circle cx="70" cy="8" r="8" fill="#AFA8F7"/></g>
    <text x="30" y="232" class="w">LEXIS<tspan fill="#8BE2DC">.</tspan></text><text x="30" y="268" class="d">Сигнал: ясность растёт по этапам</text><text x="30" y="296" class="d">Самый близкий к текущему знаку</text>
  </g>
</svg>
